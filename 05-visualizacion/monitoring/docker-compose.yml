# SOC lab: infra monitoring stack (Prometheus + Grafana + Wazuh→Telegram forwarder)
#
# Security: every published port binds to 127.0.0.1 ONLY.
# Access Grafana via SSH tunnel:  ssh -N -L 3000:localhost:3000 asgard
# Secrets come from ./.env (chmod 600, lives only on asgard, never committed).
#
# The miel26 exporter is NOT part of this stack: it runs as a standalone
# container on miel26 bound only to the tailscale IP (see 02-honeypot / T2).

services:
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    command: --path.rootfs=/host
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP="false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  tg-forwarder:
    build: ./forwarder
    container_name: tg-forwarder
    restart: unless-stopped
    # host network: needs localhost:9200 (Wazuh indexer) + outbound internet
    # for Telegram. No ports are published by this service.
    network_mode: host
    env_file: .env
    volumes:
      - fwd-state:/state

volumes:
  prom-data:
  grafana-data:
  fwd-state:
