groups:
  - name: lab-infra
    rules:
      # Asgard root disk: the indexer filling up silently stops alert indexing.
      - alert: asgard_disk_low
        expr: node_filesystem_avail_bytes{job="node-asgard",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-asgard",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Asgard root disk below 20% free"
          description: "Asgard / free space is {{ $value | humanizePercentage }} — OpenSearch indexing is at risk."

      - alert: asgard_mem_low
        expr: node_memory_MemAvailable_bytes{job="node-asgard"} < 3e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Asgard available memory below 3 GiB"
          description: "Asgard MemAvailable is {{ $value | humanize }}B."

      # miel26: the honeypot must stay reachable; if it dies, blind spot.
      - alert: miel26_down
        expr: up{job="node-miel26"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "miel26 (honeypot) exporter unreachable"
          description: "miel26 node-exporter has been down for 5m — honeypot may be self-DoS'd or offline."

      # miel26 is an e2-small (~2 GiB): watch RAM under heavy attack.
      - alert: miel26_mem_low
        expr: node_memory_MemAvailable_bytes{job="node-miel26"} < 300e6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "miel26 available memory below 300 MiB"
          description: "miel26 MemAvailable is {{ $value | humanize }}B — self-DoS risk."

      # Conntrack exhaustion drops new attacker connections and looks like downtime.
      - alert: miel26_conntrack_high
        expr: node_nf_conntrack_entries{job="node-miel26"} / node_nf_conntrack_entries_limit{job="node-miel26"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "miel26 conntrack table above 80%"
          description: "miel26 conntrack usage is {{ $value | humanizePercentage }} of the limit."
